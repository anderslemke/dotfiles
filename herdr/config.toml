onboarding = false
# herdr configuration — se `herdr --default-config` for alle muligheder.

[keys]
# hjkl-navigation med ctrl+alt (cmd+ctrl+hjkl er reserveret til Rectangle,
# som griber dem globalt — Ghostty ser dem aldrig; Rectangles default
# ctrl+alt+j/k-quarters er slået fra i Rectangle for at give plads):
# j/k = ned/op mellem workspaces, h/l = forrige/næste tab i workspacet.
next_workspace = "ctrl+alt+j"
previous_workspace = "ctrl+alt+k"
previous_tab = "ctrl+alt+h"
next_tab = "ctrl+alt+l"
switch_tab = "cmd+ctrl+1..9"

# cmd+alt+j/k = ned/op mellem agent-panes på tværs af workspaces,
# cmd+alt+1-9 = hop direkte til agent nr. N.
next_agent = "cmd+alt+j"
previous_agent = "cmd+alt+k"
focus_agent = "cmd+alt+1..9"

# In-app toasts (default er off) — bruges bl.a. af herdr-mux-pick til fejl.
[ui.toast]
delivery = "herdr"

# ctrl+alt+n = nyt space fra en opskrift: fzf-picker over ~/.tmuxinator/*.yml,
# valget bootes med herdr-mux.
[[keys.command]]
key = "ctrl+alt+n"
type = "popup"
command = "/Users/anderslemke/dotfiles/bin/herdr-mux-pick"
width = "70%"
height = "70%"
