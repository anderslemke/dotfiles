onboarding = false
# herdr configuration — se `herdr --default-config` for alle muligheder.

[keys]
# hjkl-navigation med ctrl+alt (cmd+ctrl+hjkl er reserveret til Rectangle,
# som griber dem globalt — Ghostty ser dem aldrig; Rectangles default
# ctrl+alt+j/k-quarters er slået fra i Rectangle for at give plads):
# j/k = ned/op mellem workspaces, h/l = forrige/næste tab i workspacet.
next_workspace = "ctrl+alt+j"
previous_workspace = "ctrl+alt+k"
previous_tab = "ctrl+alt+h"
next_tab = "ctrl+alt+l"
switch_tab = "cmd+ctrl+1..9"

# ctrl+shift+j/k = ned/op mellem agent-panes på tværs af workspaces,
# ctrl+shift+1-9 = hop direkte til agent nr. N.
# (ctrl+shift er frit: Rectangle bruger cmd+ctrl/hyper på j/k, Karabiner er tom,
# og hverken Ghostty, tmux eller Claude Code lytter på ctrl+shift+j/k.)
# NB: alt+shift+j/k er afprøvet (2026-08-12) og når ikke frem til herdr —
# Ghostty kører uden macos-option-as-alt (med vilje: alt bruges til [ ] { }
# på dansk layout), så Option komponerer tegn i stedet for at sende alt.
next_agent = "ctrl+shift+j"
previous_agent = "ctrl+shift+k"
focus_agent = "ctrl+shift+1..9"

# In-app toasts (default er off) — bruges bl.a. af herdr-mux-pick til fejl.
[ui.toast]
delivery = "herdr"

# Agent-rækker i sidebaren: vis terminal-titlen (Claude Code sætter den til
# sessionens aktuelle opgave), så man kan se hvad der kører på hvert table.
# Default var [["state_icon", "workspace", "tab"], ["agent"]].
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

# ctrl+alt+n = nyt space fra en opskrift: fzf-picker over ~/.tmuxinator/*.yml,
# valget bootes med herdr-mux.
[[keys.command]]
key = "ctrl+alt+n"
type = "popup"
command = "/Users/anderslemke/dotfiles/bin/herdr-mux-pick"
width = "70%"
height = "70%"
