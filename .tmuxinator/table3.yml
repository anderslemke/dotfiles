# /Users/anderslemke/.tmuxinator/table3.yml
# Mux config for Oase table3 — ports 3030 (Metro) / 4030 (mainframe) / 5430 (postgres) / 3034 (landing).
# Each window sets its own root so Ctrl-C + arrow-up replays the bare command,
# not a `cd && cmd` chain that re-cd's into a non-existent subdir.
# See ~/Projects/oasis/dotfiles/tables.md for the port plan and conventions.

name: table3
root: ~/Projects/oasis/tables/table3

windows:
  - claude: claude --dangerously-skip-permissions
  - mainframe:
      root: ~/Projects/oasis/tables/table3/mainframe
      panes:
        - vim
  - app:
      root: ~/Projects/oasis/tables/table3/oase-app
      panes:
        - vim
  - metro:
      root: ~/Projects/oasis/tables/table3/oase-app
      panes:
        - EXPO_PUBLIC_OASE_RUN_APP_IN_SCREENSHOT_MODE_WITH_THIS_MAINFRAME_ROOT=10.0.2.2:4030 yarn start --port 3030
  - docker:
      root: ~/Projects/oasis/tables/table3/mainframe
      panes:
        - docker compose -f docker-compose.yaml -f docker-compose.dev.yaml -f docker-compose.table.yaml -p oase-table3 up
  - kms:
      root: ~/Projects/oasis/tables/table3/kms
      panes:
        - docker compose -f docker-compose.yaml -f docker-compose.kms.table.yaml -p oase-table3 up
  - landing:
      root: ~/Projects/oasis/tables/table3/landing
      panes:
        - npm run dev -- --port 3034
