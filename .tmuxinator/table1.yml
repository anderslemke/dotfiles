# /Users/anderslemke/.tmuxinator/table1.yml
# Mux config for Oase table1 — ports 3010 (Metro) / 4010 (mainframe) / 5410 (postgres) / 3014 (landing).
# Each window sets its own root so Ctrl-C + arrow-up replays the bare command,
# not a `cd && cmd` chain that re-cd's into a non-existent subdir.
# See ~/Projects/oasis/dotfiles/tables.md for the port plan and conventions.

name: table1
root: ~/Projects/oasis/tables/table1

windows:
  - claude: claude --dangerously-skip-permissions
  - mainframe:
      root: ~/Projects/oasis/tables/table1/mainframe
      panes:
        - vim
  - app:
      root: ~/Projects/oasis/tables/table1/oase-app
      panes:
        - vim
  - metro:
      root: ~/Projects/oasis/tables/table1/oase-app
      panes:
        - EXPO_PUBLIC_OASE_RUN_APP_IN_SCREENSHOT_MODE_WITH_THIS_MAINFRAME_ROOT=10.0.2.2:4010 yarn start --port 3010
  - docker:
      root: ~/Projects/oasis/tables/table1/mainframe
      panes:
        - docker compose -f docker-compose.yaml -f docker-compose.dev.yaml -f docker-compose.table.yaml -p oase-table1 up
  - kms:
      root: ~/Projects/oasis/tables/table1/kms
      panes:
        - docker compose -f docker-compose.yaml -f docker-compose.kms.table.yaml -p oase-table1 up
  - landing:
      root: ~/Projects/oasis/tables/table1/landing
      panes:
        - npm run dev -- --port 3014
